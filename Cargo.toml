[package]
name = "codex-app-gpui"
version = "0.1.0"
edition = "2021"
description = "Native GPU-accelerated Codex desktop client built with Rust and GPUI."
license = "MIT"
repository = "https://github.com/1deat0r/Codex-App-GPUI"

[dependencies]
anyhow = "1"
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
ureq = { version = "3", features = ["rustls", "json"] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[profile.dev]
opt-level = 1
